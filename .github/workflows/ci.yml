name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the CLI starts
        run: python -m watchtower.main --version

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Installer is valid bash
        run: bash -n install_tools.sh

      - name: No em-dashes in tracked text
        run: |
          # Match the raw UTF-8 bytes of U+2014 so the check does not depend on the locale.
          if git grep -nI "$(printf '\xe2\x80\x94')" -- . ':!*.png'; then
            echo "Replace the em-dashes above with a colon, comma, or period." >&2
            exit 1
          fi
